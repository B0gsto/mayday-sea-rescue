<linearGradient id="gW" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="226"><stop offset="0" stop-color="#D2F4FF"/><stop offset="1" stop-color="#6CC0FF"/></linearGradient>
<g id="frame">
