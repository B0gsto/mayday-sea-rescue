<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FAFF"/><stop offset="0.55" stop-color="#CDE9FF"/><stop offset="1" stop-color="#A9D6FC"/></linearGradient>
