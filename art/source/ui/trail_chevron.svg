<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 338" width="520" height="338"><!-- the onboarding trail's ground step (UI/OnboardingTrail): a chunky Lego chevron, tip toward the goal, stretched 1.3x along the path so it survives the low camera's foreshortening. Two 260x338 frames: left the sky-blue step, right the same blue step a value lighter (the travelling wave fades it in over the left). Navy outer lip (separates it from water, blue signs, the conveyor), white sticker rim, hard 28-unit outline, a darker lip under the fill, a soft gloss --><defs>
