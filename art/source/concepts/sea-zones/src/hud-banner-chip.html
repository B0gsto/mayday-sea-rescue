<!doctype html><meta charset="utf-8"><title>Crossing banner + run chip</title>
<style>@font-face{font-family:F;src:url(file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/FredokaOne-Regular.ttf)}
html,body{margin:0;background:#141A26;width:1000px;height:1000px;overflow:hidden;font-family:F;color:#fff}
.a{position:absolute}.t{font-size:17px;color:#fff;-webkit-text-stroke:3.5px #14121C;paint-order:stroke fill}
.p{position:absolute;overflow:hidden;background:#2A3A52}svg text{font-family:F;paint-order:stroke fill;stroke-linejoin:round}</style><body>
<div class="a t" style="left:14px;top:9px;font-size:24px">Crossing banner + run chip</div>
<div class="a" style="left:330px;top:17px;font-size:13px;color:#9FB2C8">iPhone landscape at 1:1 points. One pop, nothing flashes, chip has no ring</div>
<div id="phone" class="p" style="left:78px;top:42px;width:844px;height:390px;border-radius:26px;box-shadow:0 0 0 6px #05060A"></div>
<div id="ban" class="a" style="left:0;top:444px;width:1000px;height:300px"></div>
<div id="chips" class="a" style="left:0;top:744px;width:1000px;height:256px"></div>
<script src="toon.js"></script><script src="models.js"></script><script>
const rim=(x,y,w,h,r,o={})=>`<rect x="${x-5}" y="${y-5}" width="${w+10}" height="${h+10}" rx="${r+5}" fill="#fff"/><rect x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" rx="${r+2}" fill="${INK}"/>`;
const uid=(()=>{let n=0;return()=>'g'+(++n)})();
// hand-drawn zone topmarks: same silhouettes as the buoy tops
function topmark(n){const k=`stroke="${INK}" stroke-width="3.2" stroke-linejoin="round" fill="#fff"`;return[
 `<path d="M-4,15 L-15,0 A5.2,5.2 0 0,1 -10,-9 A5.2,5.2 0 0,1 -3.8,-14 A5.2,5.2 0 0,1 3.8,-14 A5.2,5.2 0 0,1 10,-9 A5.2,5.2 0 0,1 15,0 L4,15 Z" ${k}/><path d="M0,13 L-10,-7 M0,13 L-3.6,-11 M0,13 L3.6,-11 M0,13 L10,-7" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`,
 `<path d="M0,16 C-7,9 -8,4 -5,1 C-9,-3 -8,-8 -3,-10 C-5,-14 -2,-17 0,-18 C2,-17 5,-14 3,-10 C8,-8 9,-3 5,1 C8,4 7,9 0,16 Z" ${k}/><path d="M0,14 L0,-13" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`,
 `<path d="M-2.5,16 L-2.5,5 L-9,-1 L-9,-11 L-4.5,-11 L-4.5,-3 L-2.5,-1 L-2.5,-15 L2.5,-15 L2.5,-3 L4.5,-5 L4.5,-13 L9,-13 L9,-2 L2.5,5 L2.5,16 Z" ${k}/>`,
 `<path d="M3,-17 L-8,2 L-1,2 L-4,17 L9,-4 L2,-4 L7,-17 Z" ${k}/>`,
 `<path d="M-2.2,-8 A5,5 0 1,1 2.2,-8 L2.2,-3 L7,-3 L7,1 L2.2,1 L2.2,11 C6,10.5 8,8 8.5,5 L6,5 L11,-1 L14,7 L12,6 C11,12 6,16 0,16.5 C-6,16 -11,12 -12,6 L-14,7 L-11,-1 L-6,5 L-8.5,5 C-8,8 -6,10.5 -2.2,11 L-2.2,1 L-7,1 L-7,-3 L-2.2,-3 Z M0,-14 A2,2 0 1,0 0.01,-14 Z" ${k} fill-rule="evenodd"/>`][n-1]}
// rarity gems: cut changes by tier so colour never carries it alone
function gem(tier,s=1){const c=RARITY[tier],g=uid(),L=mixc(RGB(c),[255,255,255],.45).map(Math.round),D=mixc(RGB(c),[20,18,40],.42).map(Math.round),
  shape={Rare:'M0,-19 L16,0 L0,19 L-16,0 Z',Epic:'M-9,-17 L9,-17 L18,0 L9,17 L-9,17 L-18,0 Z',Legendary:'M-11,-16 L11,-16 L20,-5 L0,20 L-20,-5 Z',Mythic:'M0,-21 L6,-8 L20,-6 L10,4 L13,19 L0,12 L-13,19 L-10,4 L-20,-6 L-6,-8 Z'}[tier];
  return`<g transform="scale(${s})"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${L})"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>
  <path d="${shape}" fill="#fff" stroke="#fff" stroke-width="11" stroke-linejoin="round"/><path d="${shape}" fill="${INK}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="${shape}" fill="url(#${g})"/>
  <path d="${shape}" fill="rgb(${D})" opacity=".55" clip-path="inset(50% 0 0 0)"/><path d="M-6,-11 L3,-11 L-2,-2 L-9,-3 Z" fill="#fff" opacity=".78"/></g>`}
// crossing banner: studded plaque, white rim, hard outline, gradient + lip, topmark tile, name, best gem
function banner(zi,x=0,y=0,s=1){const z=ZONES[zi],g=uid(),W=372,H=64,lt=mixc(RGB(z.key),[255,255,255],.34).map(Math.round);
  let st='';for(let k=0;k<3;k++){const sx=120+k*62;st+=`<rect x="${sx-4}" y="-7" width="38" height="18" rx="6" fill="#fff"/><rect x="${sx}" y="-3" width="30" height="16" rx="4" fill="${INK}"/><rect x="${sx+3}" y="0" width="24" height="12" rx="3" fill="rgb(${lt})"/>`}
  return`<svg class="a" style="left:${x}px;top:${y}px;overflow:visible" width="${(W+44)*s}" height="${(H+22)*s}" viewBox="-30 -10 ${W+44} ${H+22}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${lt})"/><stop offset=".62" stop-color="${z.key}"/><stop offset="1" stop-color="${z.key}"/></linearGradient></defs>
  ${st}${rim(0,0,W,H,20)}<rect x="1" y="1" width="${W-2}" height="${H-2}" rx="19" fill="${z.keyD}"/><rect x="1" y="1" width="${W-2}" height="${H-9}" rx="19" fill="url(#${g})"/><rect x="14" y="5" width="${W-28}" height="15" rx="7.5" fill="#fff" opacity=".28"/>
  <g transform="translate(16,${H/2})"><circle r="36" fill="#fff"/><circle r="32.5" fill="${INK}"/><circle r="29" cy="1" fill="${z.keyD}"/><circle r="29" cy="-2.5" fill="rgb(${lt})"/><g transform="translate(0,-1) scale(1.18)">${topmark(z.n)}</g></g>
  <text x="${W/2+12}" y="${H/2+10}" text-anchor="middle" font-size="31" fill="#fff" stroke="${INK}" stroke-width="7.5">${z.name}</text>
  <g transform="translate(${W-34},${H/2})">${gem(z.gem,1.06)}</g></svg>`}
// run chip: multiplier + drain bar. Drain is a bar, not a ring (no rings round HUD items). Lifebuoy is its identity.
function buoyIcon(cx,cy){return`<g transform="translate(${cx},${cy})"><circle r="17.5" fill="#fff"/><circle r="15" fill="${INK}"/><circle r="12.2" fill="#FFF7EC"/><path d="M0,-12.2 A12.2,12.2 0 0,1 8.6,-8.6 L3.8,-3.8 A5.4,5.4 0 0,0 0,-5.4 Z M12.2,0 A12.2,12.2 0 0,1 8.6,8.6 L3.8,3.8 A5.4,5.4 0 0,0 5.4,0 Z M0,12.2 A12.2,12.2 0 0,1 -8.6,8.6 L-3.8,3.8 A5.4,5.4 0 0,0 0,5.4 Z M-12.2,0 A12.2,12.2 0 0,1 -8.6,-8.6 L-3.8,-3.8 A5.4,5.4 0 0,0 -5.4,0 Z" fill="#F26A1B"/><circle r="4.8" fill="${INK}"/></g>`}
const TIERS={'x1':['#6F8FB8','#3E5F8C','#2A456B'],'x1.25':['#45D49E','#17A87A','#0C7355'],'x1.5':['#FFD65A','#FFAE1E','#C27A0A'],'x2':['#FF8F42','#F2541B','#A92E0A']};
function chip(t,fill,x=0,y=0,s=1,low){const c=TIERS[t],g=uid(),W=140,H=52;const tw=W-58,bw=Math.max(5,tw*fill);
  return`<svg class="a" style="left:${x}px;top:${y}px;overflow:visible" width="${(W+18)*s}" height="${(H+18)*s}" viewBox="-9 -9 ${W+18} ${H+18}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs>
  ${rim(0,0,W,H,15)}<rect x="1" y="1" width="${W-2}" height="${H-2}" rx="14" fill="${c[2]}"/><rect x="1" y="1" width="${W-2}" height="${H-6}" rx="14" fill="url(#${g})"/><rect x="10" y="4" width="${W-20}" height="9" rx="4.5" fill="#fff" opacity=".28"/>
  ${buoyIcon(25,25)}<text x="${48}" y="31" font-size="26" fill="#fff" stroke="${INK}" stroke-width="6">${t}</text>
  <rect x="47" y="35" width="${tw+2}" height="11" rx="5.5" fill="${INK}"/><rect x="49" y="37" width="${bw-2}" height="7" rx="3.5" fill="${low?'#FF3B3B':'#FFF7EC'}"/>${low?'':`<rect x="49" y="37" width="${bw-2}" height="3" rx="1.5" fill="#fff"/>`}</svg>`}

// phone in context: entering Coral Drift, with the current HUD's layout as dim stand-ins
{const ph=document.getElementById('phone'),W=844,H=390,F=278,hz=128,camH=14,pal=ZONES[2],c=canvasIn(ph,W,H),x=c.getContext('2d');paintSea(x,W,H,hz,F,camH,pal,{seed:5});
 const cam=seaCam(W,H,hz,F,camH,.08),items=[];for(let k=-7;k<=7;k++)items.push({mesh:buoy(3),pos:[500+k*30,0,k*95]});curtain(x,cam,W,H,[500-200,-650],[500+200,650],132,ZONES[3],.88,[1,1],4);
 items.push({mesh:landmark(2),pos:[340,0,-120]},{mesh:standinSki(),pos:[24,0,0]});x.drawImage(render(items,cam,W,H,{ss:2,fog:{col:pal.fog,start:40,end:1700}}),0,0);
 // dim HUD stand-ins, matched to the live phone layout (left grid, harbour bar, minimap, wallet)
 x.save();x.globalAlpha=.86;const tile=(a,b,cc)=>{x.fillStyle=INK;x.beginPath();x.roundRect(a-2,b-2,44,44,11);x.fill();x.fillStyle=cc;x.beginPath();x.roundRect(a,b,40,40,9);x.fill()};
 ['#F2B72A','#39C46E','#4C8FE8','#E85D5D','#8E6BE8','#39C46E','#F26A1B','#4CC8D8'].forEach((cc,i)=>tile(46+(i%2)*48,40+Math.floor(i/2)*48,cc));
 x.fillStyle=INK;x.beginPath();x.roundRect(290,14,264,36,12);x.fill();x.fillStyle='#E9EEF5';x.beginPath();x.roundRect(293,17,258,30,10);x.fill();x.fillStyle='#46C46E';x.beginPath();x.roundRect(340,31,150,10,5);x.fill();
 x.restore();
 // minimap with the zone circles (docs/29 item 3)
 const mx=W-62,my=64;x.fillStyle=INK;x.beginPath();x.arc(mx,my,48,0,7);x.fill();ZONES.slice().reverse().forEach((z,i)=>{x.fillStyle=i==0?z.water:z.water;x.beginPath();x.arc(mx,my,45-i*8,0,7);x.fill();x.strokeStyle=z.key;x.lineWidth=2.4;x.beginPath();x.arc(mx,my,45-i*8,0,7);x.stroke()});
 x.fillStyle='#F26A1B';x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(mx+16,my-22);x.lineTo(mx+24,my-11);x.lineTo(mx+13,my-13);x.closePath();x.fill();x.stroke();
 x.fillStyle=INK;x.beginPath();x.roundRect(W-124,120,112,30,10);x.fill();x.fillStyle='#FFC83A';x.beginPath();x.arc(W-108,135,10,0,7);x.fill();x.fillStyle='#fff';x.font='17px F';x.fillText('4,997,110',W-93,141);
 ph.insertAdjacentHTML('beforeend',banner(2,222,62,1)+chip('x1.5',.62,W-160,158,.9));}

// the five banners at 1:1, two columns
{const b=document.getElementById('ban');let h='<div class="a t" style="left:14px;top:0">Pop on crossing: zone name + best rarity gem</div>';
 ZONES.forEach((z,i)=>{h+=banner(i,i%2?516:36,30+Math.floor(i/2)*84)});
 // pop timing strip in the sixth slot
 h+=`<div class="a" style="left:520px;top:206px;width:440px;height:74px">`+[.62,1.08,1].map((s,k)=>banner(0,k*148,30-s*22,s*.36)).join('')+`<div class="a" style="left:6px;top:58px;font-size:13px;color:#9FB2C8">0.1 s pop 0.15 s over 1.6 s hold, then up. Reduce motion: fade</div></div>`;
 b.innerHTML=h}
// chip states
{const b=document.getElementById('chips');let h='<div class="a t" style="left:14px;top:0">Run chip: x + 75 s drain. 1:1, then 2x</div>';
 [['x1',.92,'0 delivered'],['x1.25',.8,'3 in a row'],['x1.5',.55,'6 in a row'],['x2',.38,'10, cap'],['x2',.13,'last 15 s']].forEach((s,i)=>{const X=20+i*194;h+=chip(s[0],s[1],X,30,1,s[2]=='last 15 s')+`<div class="a" style="left:${X+14}px;top:102px;font-size:13px;color:#9FB2C8">${s[2]}</div>`});
 h+=chip('x1.5',.55,150,122,1.7)+chip('x2',.13,560,122,1.7,true);b.innerHTML=h}
</script>
