<!doctype html><meta charset="utf-8"><title>Five zones board</title>
<style>@font-face{font-family:F;src:url(file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/FredokaOne-Regular.ttf)}
html,body{margin:0;background:#141A26;width:1000px;height:1000px;overflow:hidden;font-family:F;color:#fff}
.a{position:absolute}.t{font-size:17px;color:#fff;-webkit-text-stroke:3.5px #14121C;paint-order:stroke fill}
.p{position:absolute;overflow:hidden;border-radius:10px;background:#2A3A52}.sw{position:absolute;left:0;width:192px;height:38px;border-radius:7px;box-sizing:border-box;padding:3px 8px;font-size:13px;line-height:15px;color:#fff;-webkit-text-stroke:2.5px #14121C;paint-order:stroke fill;border:2px solid #14121C}
.sw b{display:block;font-weight:400;font-size:12px;opacity:.95}</style><body>
<div class="a t" style="left:14px;top:9px;font-size:24px">Five sea zones, from the boat</div>
<div class="a" style="left:360px;top:17px;font-size:13px;color:#9FB2C8">Chase camera, no outlines. Each scene: your craft, a swimmer, the line ahead</div>
<script src="toon.js"></script><script src="models.js"></script><script>
const W=192,GAP=5,H=704,F=556,hz=280,camH=14;const ski=standinSki(),sw=swimmer();
ZONES.forEach((pal,i)=>{const X=10+i*(W+GAP),d=document.createElement('div');d.className='p';d.style.cssText=`left:${X}px;top:44px;width:${W}px;height:${H}px`;document.body.appendChild(d);
  const n=document.createElement('div');n.className='a t';n.style.cssText='left:9px;top:6px;z-index:3';n.textContent=pal.name;d.appendChild(n);
  const c=canvasIn(d,W,H),x=c.getContext('2d');paintSea(x,W,H,hz,F,camH,pal,{seed:i+3});const cam=seaCam(W,H,hz,F,camH,0);
  const next=ZONES[i+1],items=[];
  // Abyss only: a pale cold band behind the wreck so its silhouette holds, the water stays near-black
  if(i==4){const g=x.createLinearGradient(0,hz-150,0,hz);g.addColorStop(0,'rgba(120,108,240,0)');g.addColorStop(1,'rgba(142,130,255,.82)');x.fillStyle=g;x.fillRect(0,hz-150,W,150)}
  if(next){for(let k=-5;k<=5;k++)items.push({mesh:buoy(i+1),pos:[430,0,k*80+20]});curtain(x,cam,W,H,[430,-420],[430,460],132,next,.92,[1,1],i)}
  const lm=[[900,0,-60,0],[250,0,-44,0],[250,0,14,0],[300,0,34,0],[620,0,20,0]][i];
  items.push({mesh:landmark(i),pos:[lm[0],0,lm[2]],yaw:i==4?1.1:0,scale:i==0?.85:i==4?.75:1});
  items.push({mesh:sw,pos:[100,0,-15],yaw:.4});items.push({mesh:ski,pos:[46,0,0],yaw:.0});
  x.drawImage(render(items,cam,W,H,{ss:3,bands:7,fog:{col:pal.fog,start:40,end:pal.fogD*1.25}}),0,0);
  // weather read: storm rain, abyss glints; both drawn as flat strokes, nothing flashes
  if(i==3){x.strokeStyle='rgba(235,245,255,.34)';x.lineWidth=1.3;const R=rng(5);for(let k=0;k<150;k++){const a=R()*W,b=R()*H;x.beginPath();x.moveTo(a,b);x.lineTo(a-6,b+22);x.stroke()}}
  if(i==4){const R=rng(9);for(let k=0;k<70;k++){const y=hz+8+Math.pow(R(),1.6)*(H-hz-120),a=R()*W,s=(y-hz)/170+.6;x.fillStyle=k%3?'rgba(126,120,242,.8)':'rgba(180,240,255,.85)';x.fillRect(a,y,s*2.4,s*1.1)}}
  // palette swatches
  const rows=[['Water',pal.water],['Deep',pal.deep],['Fog',pal.fog],['Sky',pal.skyTop],['Key',pal.key],['Glow',pal.glow]];
  rows.forEach((r,j)=>{const s=document.createElement('div');s.className='sw';s.style.cssText=`left:${X}px;top:${754+j*41}px;background:${r[1]}`;s.innerHTML=`${r[0]}<b>${r[1]}</b>`;document.body.appendChild(s)})});
</script>
